[project]
name = "bdx-r-deploy"
version = "0.1.0"
description = "BDX-R Robot Deployment — sim and real"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "colorama>=0.4.6",
    "jinja2>=3.1.6",
    "matplotlib",
    "mujoco>=3.2.3",
    "numpy",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.1,<1.22; python_version < '3.14'",
    "onnxruntime>=1.24.1,<2; python_version >= '3.14' and python_version < '3.15'",
    "pandas>=2.3.3",
    "plotly>=6.6.0",
    "pynput>=1.8.1",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
    "scipy",
    "tabulate>=0.10.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
real = [
    "python-can>=4.5.0",
    "robstride",
    "adafruit-extended-bus",
    "adafruit-circuitpython-bno055",
    "scipy",
]
orbbec = [
    "pyorbbecsdk2>=2.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bdx_api"]
